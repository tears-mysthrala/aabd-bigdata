# Frontal HTTPS del laboratorio. Solo expone la UI de NiFi;
# MySQL/Mongo quedan en 127.0.0.1 (ver docker-compose.yml).
# DNS diferido a petición: así `nginx -t` valida fuera de la red compose
# y en runtime resuelve vía DNS embebido de Docker (127.0.0.11).
resolver 127.0.0.11 valid=30s;

server {
  listen 80;
  server_name nifi.bigdata.local bigdata.local;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name nifi.bigdata.local;

  ssl_certificate /etc/nginx/certs/bigdata.local.crt;
  ssl_certificate_key /etc/nginx/certs/bigdata.local.key;

  location / {
    set $nifi_backend nifi;
    proxy_pass https://$nifi_backend:8443;
    # El backend NiFi usa su propio autofirmado: no verificable, solo cifrado.
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;

    proxy_set_header Host localhost:8443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cabeceras que NiFi espera tras un proxy inverso:
    proxy_set_header X-ProxyScheme https;
    proxy_set_header X-ProxyHost $host;
    proxy_set_header X-ProxyPort 443;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
