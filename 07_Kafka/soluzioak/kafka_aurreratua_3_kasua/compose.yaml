# Laboratorio dedicado al caso 3; puertos loopback y sin container_name global.
services:
  zoo:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
    command: /opt/kafka/bin/zookeeper-server-start.sh /opt/kafka/config/zookeeper.properties
  kafka1:
    image: apache/kafka:3.7.0
    depends_on: [zoo]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports: ["127.0.0.1:29092:29092"]
    volumes:
      - ./broker-1.properties:/etc/kafka/broker.properties:ro
    command: /opt/kafka/bin/kafka-server-start.sh /etc/kafka/broker.properties
  kafka2:
    image: apache/kafka:3.7.0
    depends_on: [zoo]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports: ["127.0.0.1:29093:29093"]
    volumes:
      - ./broker-2.properties:/etc/kafka/broker.properties:ro
    command: /opt/kafka/bin/kafka-server-start.sh /etc/kafka/broker.properties
  kafka3:
    image: apache/kafka:3.7.0
    depends_on: [zoo]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports: ["127.0.0.1:29094:29094"]
    volumes:
      - ./broker-3.properties:/etc/kafka/broker.properties:ro
    command: /opt/kafka/bin/kafka-server-start.sh /etc/kafka/broker.properties
  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27027:27017"]
