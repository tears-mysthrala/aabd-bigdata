input {
  file {
    path => "/datos/web.log"
    mode => "read"
    exit_after_read => true
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/aabd-completados.log"
    ecs_compatibility => "disabled"
  }
}
filter {
  grok {
    match => { "message" => "^(?<timestamp>%{MONTHDAY}/%{MONTH}/%{YEAR}:%{TIME}) %{IP:bezero_ip} %{WORD:metodoa} %{URIPATHPARAM:request} %{INT:status_code:int}$" }
  }
  if "_grokparsefailure" not in [tags] {
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss"]
      locale => "en"
      timezone => "Europe/Madrid"
    }
  }
  if "_grokparsefailure" not in [tags] and "_dateparsefailure" not in [tags] and [status_code] >= 400 {
    mutate { add_tag => ["errorea"] }
  }
}
output { stdout { codec => json_lines } }
