# privileged: false — lab-only compose (no auth, loopback only)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: iabd-elasticsearch
# Recursos mínimos verificados 2026-09-28 (host 7 GB con NiFi arriba):
# ES arranca con heap 512m; Kibana 9.5.4 NECESITA ~1g de heap Node
# (--max-old-space-size=512 aborta con exit 134). Consumo medido:
# ES ~770 MB + Kibana ~750 MB RSS. Si hay RAM de sobra, subir a 1g/2g.
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: iabd-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - elasticsearch
volumes:
  elasticsearch_data:
