name: aabd-elastic-novedades-20261005
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1100m
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    profiles: [gui]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=1024
      TELEMETRY_ENABLED: "false"
    mem_limit: 1500m
    ports: ["127.0.0.1:15601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
  apache:
    image: httpd:2.4@sha256:41163d514c02ac205161c1549b499bc11adfdeb6291735b433d706af7e64382a
    mem_limit: 128m
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./web:/usr/local/apache2/htdocs:ro
      - apache-logs:/usr/local/apache2/logs
    command:
      - /bin/sh
      - -c
      - |
        if ! grep -Fq 'CustomLog "/usr/local/apache2/logs/access_log" common' /usr/local/apache2/conf/httpd.conf; then
          echo 'CustomLog "/usr/local/apache2/logs/access_log" common' >> /usr/local/apache2/conf/httpd.conf
        fi
        exec httpd-foreground
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.4
    user: root
    mem_limit: 256m
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - apache-logs:/var/log/apache:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch: {condition: service_healthy}
      apache: {condition: service_started}
volumes:
  es-data:
  apache-logs:
  filebeat-data:
