# Validación solo en PR (nunca en push a master): material de estudio, sin despliegues.
# - leaks: historial de la PR (Gitleaks) y diff por SHA (TruffleHog OSS)
# - quality: ruff (mismo listón que proyecto_cnc_guard) + compileall
# - tests: unitarios rápidos sin broker ni dataset 10M (eso es local)
name: validate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  leaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (full reachable history, redacted output)
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact=100 --no-banner
      # TruffleHog 3.97.9, pinned to the image used by the original action.
      - name: TruffleHog (exact reviewed false positives only)
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$SCAN_BASE" != "$SCAN_HEAD"
          report="$RUNNER_TEMP/trufflehog.jsonl"
          umask 077
          scan_exit=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db \
            git file:///repo --since-commit "$SCAN_BASE" --branch "$SCAN_HEAD" \
            --fail --fail-on-scan-errors --no-update --json > "$report" || scan_exit=$?
          python3 .github/scripts/check_trufflehog.py "$report" "$scan_exit"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install 'ruff==0.16.8'
      - run: ruff check --select E4,E7,E9,F,I .github/scripts/ && ruff format --check .github/scripts/
      - run: ruff check --select E4,E7,E9,F,I 01_Erronka1_CNC_Guard/proyecto_cnc_guard/src 01_Erronka1_CNC_Guard/proyecto_cnc_guard/tests 01_Erronka1_CNC_Guard/proyecto_cnc_guard/scripts 01_Erronka1_CNC_Guard/proyecto_cnc_guard/generar_notebook.py 03_ML_5072/soluzioak/5072_ML_praktika.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/5073_2_Datu_Zientzia_PDF_Ariketak.py 07_Kafka/soluzioak/ 00_Transversal/scripts/moodle_publish.py 00_Transversal/scripts/test_moodle_publish.py 00_Transversal/scripts/test_moodle_sync_auth.py 03_ML_5072/soluzioak/SVM/ 05_BigData_Ingeniaritza/soluzioak/03_Elastic_Stack/novedades_2026-10-05/ 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/ariketa_2_4_2_5_docente.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/test_agregazio_docente.py 04_Programazioa_5073/data/generar_cnc_10M.py 04_Programazioa_5073/data/test_estabilidad_10M.py 04_Programazioa_5073/git_ariketa_4_2/
      - run: ruff format --check 01_Erronka1_CNC_Guard/proyecto_cnc_guard/src 01_Erronka1_CNC_Guard/proyecto_cnc_guard/tests 01_Erronka1_CNC_Guard/proyecto_cnc_guard/scripts 01_Erronka1_CNC_Guard/proyecto_cnc_guard/generar_notebook.py 03_ML_5072/soluzioak/5072_ML_praktika.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/5073_2_Datu_Zientzia_PDF_Ariketak.py 07_Kafka/soluzioak/ 00_Transversal/scripts/moodle_publish.py 00_Transversal/scripts/test_moodle_publish.py 00_Transversal/scripts/test_moodle_sync_auth.py 03_ML_5072/soluzioak/SVM/ 05_BigData_Ingeniaritza/soluzioak/03_Elastic_Stack/novedades_2026-10-05/ 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/ariketa_2_4_2_5_docente.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/test_agregazio_docente.py 04_Programazioa_5073/data/generar_cnc_10M.py 04_Programazioa_5073/data/test_estabilidad_10M.py 04_Programazioa_5073/git_ariketa_4_2/
      # Solo código Python real: los .py docentes de materialak/ llevan magics
      # IPython (!pip/!git) y no compilan por diseño (son compañeros del .ipynb).
      - run: python -m compileall -q 03_ML_5072/soluzioak/SVM/ 05_BigData_Ingeniaritza/soluzioak/03_Elastic_Stack/novedades_2026-10-05/ 07_Kafka/soluzioak/kafka_aurreratua_connect/caso5/ 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/ariketa_2_4_2_5_docente.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/test_agregazio_docente.py 00_Transversal/scripts/moodle_sync.py 00_Transversal/scripts/moodle_publish.py 00_Transversal/scripts/test_moodle_publish.py 00_Transversal/scripts/test_moodle_sync_auth.py 01_Erronka1_CNC_Guard/proyecto_cnc_guard/src 01_Erronka1_CNC_Guard/proyecto_cnc_guard/tests 01_Erronka1_CNC_Guard/proyecto_cnc_guard/scripts 01_Erronka1_CNC_Guard/proyecto_cnc_guard/generar_notebook.py 03_ML_5072/soluzioak/5072_ML_praktika.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/5073_2_Datu_Zientzia_PDF_Ariketak.py 07_Kafka/soluzioak/kafka_producer.py 07_Kafka/soluzioak/kafka_consumer.py 07_Kafka/soluzioak/test_kafka_mock.py 04_Programazioa_5073/data/generar_cnc_10M.py 04_Programazioa_5073/data/test_estabilidad_10M.py 04_Programazioa_5073/git_ariketa_4_2/agur.py 04_Programazioa_5073/git_ariketa_4_2/test_agur.py

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest numpy pandas scikit-learn requests beautifulsoup4
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: pytest -q 07_Kafka/soluzioak/test_kafka_mock.py 00_Transversal/scripts/test_moodle_publish.py 00_Transversal/scripts/test_moodle_sync_auth.py 04_Programazioa_5073/soluzioak/04_Datu_Zientzia_PDF_Ariketak/test_agregazio_docente.py 04_Programazioa_5073/git_ariketa_4_2/test_agur.py
      - run: PYTHONPATH=src pytest -q tests/
        working-directory: 01_Erronka1_CNC_Guard/proyecto_cnc_guard
