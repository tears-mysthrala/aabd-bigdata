  # =========================================================
  # APACHE NIFI
  # =========================================================
  nifi:
    image: apache/nifi:latest
    container_name: iabd-nifi-kafka
    hostname: nifi

    ports:
      - "8443:8443"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: nifi
      SINGLE_USER_CREDENTIALS_PASSWORD: nifinifinifi

    volumes:
      - ./irteera:/opt/nifi/kafka-output

    depends_on:
      - kafka1
      - kafka2
      - kafka3

